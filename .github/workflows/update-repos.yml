name: Refresh profile data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate profile metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_profile_metrics.py

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/profile-metrics.svg assets/profile-metrics-mobile.svg; then
            echo "Profile data is already current."
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/profile-metrics.svg assets/profile-metrics-mobile.svg
          git commit -m "chore: refresh profile data"
          git push
